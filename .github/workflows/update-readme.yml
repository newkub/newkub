name: Update Latest Commits

on:
  schedule:
    # Run every 2 hours
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Fetch commits and update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bun << 'EOF'
          const OWNER = "newkub";
          const ORG = "wrikka";

          async function ghApi(path) {
            const res = await fetch(`https://api.github.com${path}`, {
              headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: "application/vnd.github+json",
              },
            });
            if (!res.ok) return null;
            return res.json();
          }

          async function getRepos(owner, isOrg) {
            const repos = [];
            let page = 1;
            while (page <= 10) {
              const data = await ghApi(
                `/${isOrg ? "orgs" : "users"}/${owner}/repos?per_page=100&page=${page}&type=owner`
              );
              if (!data || data.length === 0) break;
              for (const r of data) {
                if (!r.fork && !r.archived) repos.push(r);
              }
              page++;
            }
            return repos.sort((a, b) =>
              new Date(b.pushed_at).getTime() - new Date(a.pushed_at).getTime()
            ).slice(0, 8);
          }

          async function getLatestCommit(repo) {
            const data = await ghApi(`/repos/${repo}/commits?per_page=1`);
            if (!data || data.length === 0) return null;
            const c = data[0];
            return {
              date: c.commit.author.date,
              sha: c.sha.slice(0, 7),
              fullSha: c.sha,
              message: c.commit.message.split("\n")[0],
              repo,
            };
          }

          function relativeTime(dateStr) {
            const diff = Date.now() - new Date(dateStr).getTime();
            const s = Math.floor(diff / 1000);
            if (s < 60) return `${s} second${s !== 1 ? "s" : ""} ago`;
            const m = Math.floor(s / 60);
            if (m < 60) return `${m} minute${m !== 1 ? "s" : ""} ago`;
            const h = Math.floor(m / 60);
            if (h < 24) return `${h} hour${h !== 1 ? "s" : ""} ago`;
            const d = Math.floor(h / 24);
            if (d < 7) return `${d} day${d !== 1 ? "s" : ""} ago`;
            const w = Math.floor(d / 7);
            if (w < 5) return `${w} week${w !== 1 ? "s" : ""} ago`;
            const mo = Math.floor(d / 30);
            return `${mo} month${mo !== 1 ? "s" : ""} ago`;
          }

          const userRepos = await getRepos(OWNER, false);
          const orgRepos = await getRepos(ORG, true);
          const allRepos = [...new Set([
            ...userRepos.map((r) => r.full_name),
            ...orgRepos.map((r) => r.full_name),
          ])];

          const commits = [];
          for (const repo of allRepos) {
            const c = await getLatestCommit(repo);
            if (c) commits.push(c);
          }

          commits.sort((a, b) =>
            new Date(b.date).getTime() - new Date(a.date).getTime()
          );

          const top = commits.slice(0, 5);

          const lines = [
            "| Commit | Repository | Message | Time |",
            "|:-------|:-----------|:--------|-----:|",
          ];
          for (const c of top) {
            const msg = c.message.length > 60
              ? c.message.slice(0, 57) + "..."
              : c.message;
            lines.push(
              `| \`${c.sha}\` | [${c.repo}](https://github.com/${c.repo}/commit/${c.fullSha}) | ${msg} | ${relativeTime(c.date)} |`
            );
          }
          const table = lines.join("\n");

          const readme = await Bun.file("README.md").text();
          const updated = readme.replace(
            /<!-- START COMMIT LIST -->[\s\S]*?<!-- END COMMIT LIST -->/,
            `<!-- START COMMIT LIST -->\n${table}\n<!-- END COMMIT LIST -->`
          );

          await Bun.write("README.md", updated);
          console.log("README updated successfully");
          EOF

      - name: Commit and push if changed
        run: |
          if git diff --quiet README.md; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: auto-update latest commits"
            git push
          fi
