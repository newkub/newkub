name: Update Latest Commits

on:
  schedule:
    # Run every 2 hours
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest commits and update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Get latest repos by pushed_at from user (newkub) and org (wrikka)
          USER_REPOS=$(gh api user/repos --paginate --jq '[.[] | select(.fork == false and .archived == false)] | sort_by(.pushed_at) | reverse | .[:8] | .[].full_name' 2>/dev/null || echo "")
          ORG_REPOS=$(gh api orgs/wrikka/repos --paginate --jq '[.[] | select(.fork == false and .archived == false)] | sort_by(.pushed_at) | reverse | .[:4] | .[].full_name' 2>/dev/null || echo "")

          ALL_REPOS=$(echo -e "${USER_REPOS}\n${ORG_REPOS}" | grep -v '^$' | sort -u)

          # Fetch latest commit for each repo, output as TSV
          COMMIT_DATA=""
          for repo in $ALL_REPOS; do
            commit_info=$(gh api "repos/${repo}/commits" --jq '.[0] | "\(.commit.author.date)\t\(.sha[:7])\t\(.commit.message | split("\n")[0])\t'"${repo}"'"' 2>/dev/null || echo "")
            if [ -n "$commit_info" ]; then
              COMMIT_DATA="${COMMIT_DATA}${commit_info}"$'\n'
            fi
          done

          # Sort by date descending, take top 5
          TOP_COMMITS=$(echo "$COMMIT_DATA" | grep -v '^$' | sort -r | head -5)

          # Write TOP_COMMITS to temp file for Python
          echo "$TOP_COMMITS" > /tmp/commits.tsv

      - name: Update README with Python
        run: |
          python3 << 'PYEOF'
          import re
          from datetime import datetime, timezone

          def relative_time(commit_date_str):
              """Calculate relative time from ISO date string."""
              dt = datetime.fromisoformat(commit_date_str.replace('Z', '+00:00'))
              now = datetime.now(timezone.utc)
              diff = now - dt
              seconds = int(diff.total_seconds())

              if seconds < 60:
                  return f"{seconds} second{'s' if seconds != 1 else ''} ago"
              elif seconds < 3600:
                  m = seconds // 60
                  return f"{m} minute{'s' if m != 1 else ''} ago"
              elif seconds < 86400:
                  h = seconds // 3600
                  return f"{h} hour{'s' if h != 1 else ''} ago"
              elif seconds < 604800:
                  d = seconds // 86400
                  return f"{d} day{'s' if d != 1 else ''} ago"
              elif seconds < 2592000:
                  w = seconds // 604800
                  return f"{w} week{'s' if w != 1 else ''} ago"
              else:
                  mo = seconds // 2592000
                  return f"{mo} month{'s' if mo != 1 else ''} ago"

          # Read commit data
          rows = []
          with open('/tmp/commits.tsv', 'r') as f:
              for line in f:
                  line = line.strip()
                  if not line:
                      continue
                  parts = line.split('\t')
                  if len(parts) != 4:
                      continue
                  date_str, sha, message, repo = parts
                  # Truncate message if too long
                  if len(message) > 60:
                      message = message[:57] + '...'
                  rel = relative_time(date_str)
                  rows.append((sha, repo, message, rel))

          # Build table
          lines = [
              "| Commit | Repository | Message | Time |",
              "|:-------|:-----------|:--------|-----:|",
          ]
          for sha, repo, message, rel in rows:
              lines.append(f"| `{sha}` | [{repo}](https://github.com/{repo}/commit/{sha}) | {message} | {rel} |")

          table = '\n'.join(lines)

          # Read README
          with open('README.md', 'r') as f:
              content = f.read()

          # Replace between markers
          pattern = r'<!-- START COMMIT LIST -->.*?<!-- END COMMIT LIST -->'
          replacement = f'<!-- START COMMIT LIST -->\n{table}\n<!-- END COMMIT LIST -->'
          new_content = re.sub(pattern, replacement, content, flags=re.DOTALL)

          with open('README.md', 'w') as f:
              f.write(new_content)

          print("README updated successfully")
          PYEOF

      - name: Commit and push if changed
        run: |
          if git diff --quiet README.md; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: auto-update latest commits"
            git push
          fi
