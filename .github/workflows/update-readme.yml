name: Update Latest Commits

on:
  schedule:
    # Run every 4 hours
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Fetch commits and update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="${PAT_TOKEN:-$GH_TOKEN}"
          export TOKEN
          cat > /tmp/update-readme.ts << 'SCRIPT'
          const OWNER = "newkub";
          const ORG = "wrikka";
          const TOP_COMMIT_COUNT = 5;
          const MAX_REPOS_PER_SOURCE = 500;
          const CONCURRENCY = 8;
          const TOKEN = process.env.TOKEN!;

          if (!TOKEN) {
            throw new Error("Missing TOKEN: set PAT_TOKEN or GITHUB_TOKEN secret");
          }

          async function ghApi(path: string): Promise<any[] | any | null> {
            const res = await fetch(`https://api.github.com${path}`, {
              headers: {
                Authorization: `Bearer ${TOKEN}`,
                Accept: "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28",
                "User-Agent": "newkub/readme-updater",
              },
            });
            if (!res.ok) {
              if (res.status === 404) {
                console.warn(`API ${path} returned 404 (skipped)`);
                return null;
              }
              console.error(`API ${path} returned ${res.status}`);
              return null;
            }
            return res.json();
          }

          async function getRepos(owner: string, isOrg: boolean) {
            const repos: any[] = [];
            const type = isOrg ? "all" : "owner";
            let page = 1;

            while (page <= 10 && repos.length < MAX_REPOS_PER_SOURCE) {
              const endpoint = `/${isOrg ? "orgs" : "users"}/${owner}/repos?per_page=100&page=${page}&type=${type}&sort=pushed&direction=desc`;
              const data = await ghApi(endpoint);
              if (!data || !Array.isArray(data) || data.length === 0) break;

              for (const r of data) {
                if (r.fork || r.archived) continue;
                repos.push(r);
                if (repos.length >= MAX_REPOS_PER_SOURCE) break;
              }

              if (data.length < 100) break;
              page++;
            }

            console.log(`Found ${repos.length} repos for ${isOrg ? "org" : "user"} ${owner}`);
            return repos;
          }

          async function getLatestCommit(repo: string) {
            const data = await ghApi(`/repos/${repo}/commits?per_page=1`);
            if (!data || !Array.isArray(data) || data.length === 0) return null;
            const c = data[0];
            return {
              date: c.commit.committer?.date || c.commit.author.date,
              sha: c.sha.slice(0, 7),
              fullSha: c.sha,
              message: c.commit.message.split("\n")[0],
              repo,
            };
          }

          async function pMap<T, R>(items: T[], fn: (item: T) => Promise<R>, concurrency: number): Promise<R[]> {
            const results: R[] = [];
            const queue = [...items];
            const workers = Array.from({ length: concurrency }, async () => {
              while (queue.length > 0) {
                const item = queue.shift()!;
                try {
                  const res = await fn(item);
                  if (res !== undefined) results.push(res);
                } catch (err) {
                  console.error(`Error processing ${item}:`, err);
                }
              }
            });
            await Promise.all(workers);
            return results;
          }

          function relativeTime(dateStr: string): string {
            const diff = Date.now() - new Date(dateStr).getTime();
            const s = Math.floor(diff / 1000);
            if (s < 60) return `${s} second${s !== 1 ? "s" : ""} ago`;
            const m = Math.floor(s / 60);
            if (m < 60) return `${m} minute${m !== 1 ? "s" : ""} ago`;
            const h = Math.floor(m / 60);
            if (h < 24) return `${h} hour${h !== 1 ? "s" : ""} ago`;
            const d = Math.floor(h / 24);
            if (d < 7) return `${d} day${d !== 1 ? "s" : ""} ago`;
            const w = Math.floor(d / 7);
            if (w < 5) return `${w} week${w !== 1 ? "s" : ""} ago`;
            const mo = Math.floor(d / 30);
            return `${mo} month${mo !== 1 ? "s" : ""} ago`;
          }

          const userRepos = await getRepos(OWNER, false);
          const orgRepos = await getRepos(ORG, true);

          const repoNames = [
            ...userRepos.map((r) => r.full_name),
            ...orgRepos.map((r) => r.full_name),
          ];

          console.log(`Fetching latest commits for ${repoNames.length} repos...`);
          const commits = await pMap(repoNames, getLatestCommit, CONCURRENCY);
          const validCommits = commits.filter(Boolean);

          console.log(`Fetched ${validCommits.length} commits`);

          validCommits.sort((a, b) => new Date(b.date).getTime() - new Date(a.date).getTime());
          const top = validCommits.slice(0, TOP_COMMIT_COUNT);

          const lines = [
            "| Commit | Repository | Message | Time |",
            "|:-------|:-----------|:--------|-----:|",
          ];

          for (const c of top) {
            const msg = c.message.length > 60 ? c.message.slice(0, 57) + "..." : c.message;
            lines.push(
              `| [\`${c.sha}\`](https://github.com/${c.repo}/commit/${c.fullSha}) | [${c.repo}](https://github.com/${c.repo}) | ${msg} | ${relativeTime(c.date)} |`
            );
          }

          const table = lines.join("\n");

          const readme = await Bun.file("README.md").text();
          const updated = readme.replace(
            /<!-- START COMMIT LIST -->[\s\S]*?<!-- END COMMIT LIST -->/,
            `<!-- START COMMIT LIST -->\n${table}\n<!-- END COMMIT LIST -->`
          );

          await Bun.write("README.md", updated);
          console.log("README updated successfully");
          SCRIPT
          bun /tmp/update-readme.ts

      - name: Commit and push if changed
        run: |
          if git diff --quiet README.md; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: auto-update latest commits"
            git push
          fi
