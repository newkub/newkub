name: Update Latest Commits

on:
  schedule:
    # Run every 2 hours
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest commits and update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Get latest repos by pushed_at from user (newkub) and org (wrikka)
          USER_REPOS=$(gh api user/repos --paginate --jq '[.[] | select(.fork == false and .archived == false)] | sort_by(.pushed_at) | reverse | .[:8] | .[].full_name' 2>/dev/null || echo "")
          ORG_REPOS=$(gh api orgs/wrikka/repos --paginate --jq '[.[] | select(.fork == false and .archived == false)] | sort_by(.pushed_at) | reverse | .[:4] | .[].full_name' 2>/dev/null || echo "")

          ALL_REPOS=$(echo -e "${USER_REPOS}\n${ORG_REPOS}" | grep -v '^$' | sort -u)

          # Fetch latest commit for each repo
          COMMIT_DATA=""
          for repo in $ALL_REPOS; do
            commit_info=$(gh api "repos/${repo}/commits" --jq '.[0] | "\(.commit.author.date)|\(.sha[:7])|\(.commit.message | split("\n")[0])|'"${repo}"'"' 2>/dev/null || echo "")
            if [ -n "$commit_info" ]; then
              COMMIT_DATA="${COMMIT_DATA}${commit_info}"$'\n'
            fi
          done

          # Sort by date descending, take top 5
          TOP_COMMITS=$(echo "$COMMIT_DATA" | grep -v '^$' | sort -r | head -5)

          # Build table markdown with relative time
          TABLE_HEADER="| Commit | Repository | Message | Time |"$'\n'"|:-------|:-----------|:--------|-----:|"
          TABLE_ROWS=""

          while IFS='|' read -r date sha message repo; do
            if [ -n "$repo" ]; then
              # Calculate relative time
              commit_epoch=$(date -d "$date" +%s 2>/dev/null || echo 0)
              now_epoch=$(date +%s)
              diff_seconds=$((now_epoch - commit_epoch))

              if [ "$diff_seconds" -lt 60 ]; then
                rel_time="${diff_seconds} seconds ago"
              elif [ "$diff_seconds" -lt 3600 ]; then
                minutes=$((diff_seconds / 60))
                rel_time="${minutes} minute$([ "$minutes" -ne 1 ] && echo 's') ago"
              elif [ "$diff_seconds" -lt 86400 ]; then
                hours=$((diff_seconds / 3600))
                rel_time="${hours} hour$([ "$hours" -ne 1 ] && echo 's') ago"
              elif [ "$diff_seconds" -lt 604800 ]; then
                days=$((diff_seconds / 86400))
                rel_time="${days} day$([ "$days" -ne 1 ] && echo 's') ago"
              elif [ "$diff_seconds" -lt 2592000 ]; then
                weeks=$((diff_seconds / 604800))
                rel_time="${weeks} week$([ "$weeks" -ne 1 ] && echo 's') ago"
              else
                months=$((diff_seconds / 2592000))
                rel_time="${months} month$([ "$months" -ne 1 ] && echo 's') ago"
              fi

              # Truncate message if too long
              if [ ${#message} -gt 60 ]; then
                message="${message:0:57}..."
              fi

              TABLE_ROWS="${TABLE_ROWS}| \`${sha}\` | [${repo}](https://github.com/${repo}/commit/${sha}) | ${message} | ${rel_time} |"$'\n'
            fi
          done <<< "$TOP_COMMITS"

          COMMIT_LIST="${TABLE_HEADER}"$'\n'"${TABLE_ROWS}"

          # Update README between markers
          README="README.md"
          if [ -f "$README" ]; then
            perl -i -0pe 's/<!-- START COMMIT LIST -->.*?<!-- END COMMIT LIST -->/<!-- START COMMIT LIST -->\n'"${COMMIT_LIST}"'<!-- END COMMIT LIST -->/s' "$README"
          fi

      - name: Commit and push if changed
        run: |
          if git diff --quiet README.md; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: auto-update latest commits"
            git push
          fi
